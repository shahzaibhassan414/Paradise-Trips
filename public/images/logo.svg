<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Text Path -->
    <path id="topTextPath" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
    <!-- Bottom Text Path -->
    <path id="bottomTextPath" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />

    <clipPath id="innerCircleClip">
      <circle cx="250" cy="250" r="128" />
    </clipPath>
  </defs>

  <!-- Outer Navy Circle -->
  <circle cx="250" cy="250" r="240" fill="#182c4f" stroke="#ffffff" stroke-width="9" />
  
  <!-- Inner White Ring Border -->
  <circle cx="250" cy="250" r="132" fill="#182c4f" stroke="#ffffff" stroke-width="5" />

  <!-- Top Text: PARADISE -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="9">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      PARADISE
    </textPath>
  </text>

  <!-- Bottom Text: TRIPS & TOURS -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="7">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      TRIPS &amp; TOURS
    </textPath>
  </text>

  <!-- Left Flanking Sun -->
  <g transform="translate(68, 250) scale(0.65)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" />
    <!-- Sun Rays -->
    <path d="M0 -22 L0 -16 M0 22 L0 16 M-22 0 L-16 0 M22 0 L16 0 M-15 -15 L-11 -11 M15 15 L11 11 M-15 15 L-11 11 M15 -15 L11 -11" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Right Flanking Sun -->
  <g transform="translate(432, 250) scale(0.65)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" />
    <!-- Sun Rays -->
    <path d="M0 -22 L0 -16 M0 22 L0 16 M-22 0 L-16 0 M22 0 L16 0 M-15 -15 L-11 -11 M15 15 L11 11 M-15 15 L-11 11 M15 -15 L11 -11" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Inner Illustration -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Sky Background -->
    <rect x="120" y="120" width="260" height="260" fill="#5eaeb8" />

    <!-- Pale Sun in Sky -->
    <circle cx="250" cy="180" r="15" fill="#fce4b3" />

    <!-- Ocean Band -->
    <rect x="120" y="225" width="260" height="40" fill="#2d7e8a" />
    <line x1="120" y1="225" x2="380" y2="225" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

    <!-- Sand Beach -->
    <path d="M 120 260 Q 250 258 380 260 L 380 380 L 120 380 Z" fill="#f19e53" />

    <!-- Left Palm Tree -->
    <path d="M 200 290 Q 212 245 190 205" stroke="#12383d" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Left Palm Fronds -->
    <path d="M 190 205 Q 160 195 145 220" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 190 205 Q 170 178 150 185" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 190 205 Q 200 175 220 185" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 190 205 Q 215 195 225 215" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 190 205 Q 180 215 170 230" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Right Palm Tree -->
    <path d="M 300 290 Q 288 245 310 205" stroke="#12383d" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Right Palm Fronds -->
    <path d="M 310 205 Q 340 195 355 220" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 310 205 Q 330 178 350 185" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 310 205 Q 300 175 280 185" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 310 205 Q 285 195 275 215" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 310 205 Q 320 215 330 230" stroke="#12383d" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Hammock -->
    <path d="M 198 238 Q 250 270 302 238" stroke="#ffffff" stroke-width="2" fill="none" />
    <path d="M 210 244 Q 250 278 290 244 Q 250 262 210 244 Z" fill="#fae8c8" stroke="#e0cfa9" stroke-width="1" />
  </g>
</svg>
